<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="stylesheet" href="https://use.typekit.net/vmy3xbs.css" />
    <title>The Green Vanity</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><a href="index.html"><img src="vanitylogo.svg" alt="Green Simple Letter spelling The Green Vanity." /></a></h1>
        <nav>
          <ul>
            <li><a href=#>Beauty</a></li>
            <li><a href=#>Wellness</a></li>
            <li><a href=#>Fashion</a></li>
            <li><a href=#>Our Story</a></li>
            <li><a href="newsletter.html">Subscribe</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <figure><img src="subscribe.jpeg" alt="Woman covering one eye with her hand with light pink eyeshadow on the other."></figure>
        <form>
          <h2>Join the Green Vanity community!</h2>
          <section class="personal-info">
            <h3>Personal information</h3>
            <ul>
              <li><label for="name">Name:</label><input type="text" name="name" id="name" placeholder="your full name" /></li>
              <li><label for="email">Email:</label><input type="email" name="email" id="email" placeholder="confirmation email" /></li>
            </ul>
          </section>
          <section class="subscribe">
            <h3>Build Your Green Edit:</h3>
            <ul>
              <li><input type="checkbox" id="Beauty-Edit" value="Beauty Edit" /><label for="Beauty Edit">Beauty Edit</label></li>
              <li><input type="checkbox" id="Wellness-Weekly" value="Wellness Weekly" /><label for="Wellness Weekly">Wellness Weekly</label></li>
              <li><input type="checkbox" id="Fashion-Forward" value="Fashion Forward" /><label for="Fashion Forward">Fashion Forward</label></li>
              <li><input type="checkbox" id="Sustainable-Living" value="Sustainable Living" /><label for="Sustainable Living">Sustainable Living</label></li>
            </ul>
          </section>
          <section><button type="submit">Subscribe</button></section>
        </form>
      </main>
      <footer>
        <p>© All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
